<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aether</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <div id="ambientTop" hidden></div>
      <div id="ambientBottom" hidden></div>

      <!-- Clean Minimal Titlebar -->
      <header class="titlebar">
        <div class="brand">
          <div class="brand-crest">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L3 7v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V7l-9-5z" />
            </svg>
          </div>
          <div class="brand-meta">
            <span class="brand-name">AETHER</span>
            <span class="brand-tag">SHIELD</span>
          </div>
        </div>

        <div class="titlebar-controls">
          <div class="shield-badge" id="pill">
            <span class="shield-dot"></span>
            <span class="shield-text">KESİK</span>
          </div>
          <button type="button" id="lang" class="lang-switch" title="Dili Değiştir">TR</button>
        </div>
      </header>

      <!-- Main Stage -->
      <main class="main">
        <!-- Flat Minimalist Core Stage -->
        <section class="core-stage">
          <div class="power-dock">
            <button type="button" class="power-btn" id="ring" data-state="down" aria-label="Bağlantı Anahtarı">
              <svg class="power-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
                <line x1="12" y1="2" x2="12" y2="12" />
              </svg>
            </button>
          </div>

          <!-- Status & Node Info -->
          <div class="core-meta">
            <div class="status-lead">
              <span class="pulse-beacon" id="beacon"></span>
              <span class="status-title" id="stateLabel">BAĞLANTI BEKLENİYOR</span>
            </div>
            <div class="node-showcase">
              <span class="node-display" id="nodeName">Sunucu Seçilmedi</span>
            </div>

            <!-- Flat Telemetry Bar -->
            <div class="telemetry-bar" id="telemetryBar">
              <div class="telemetry-item" id="ipBadge" title="Aktif Dış IP">
                <span class="t-icon">IP</span>
                <span class="t-val" id="ipValue">127.0.0.1</span>
              </div>
              <div class="telemetry-sep"></div>
              <div class="telemetry-item" title="Tünel üzerinden ölçülen gecikme">
                <span class="t-icon">PING</span>
                <span class="t-val" id="pingValue">—</span>
              </div>
              <div class="telemetry-sep"></div>
              <div class="telemetry-item" title="Ağın HTTPS denetimi yapıp yapmadığı">
                <span class="t-icon">AĞ</span>
                <span class="t-val" id="netValue">—</span>
              </div>
            </div>
          </div>
        </section>

        <!-- Master Action Button -->
        <div class="action-dock">
          <button type="button" class="master-btn" id="go">
            <span class="btn-text" id="goText">Bağlantıyı Başlat</span>
          </button>
        </div>

        <!-- Cockpit Controls (Mode & Protocol) -->
        <div class="cockpit-deck">
          <!-- Proxy / TUN Card -->
          <div class="cockpit-card">
            <div class="card-caption">
              <span class="caption-title">Tünel Modu</span>
              <span class="caption-desc" id="modeHint">Sistem Proxy</span>
            </div>
            <div class="cockpit-segmented">
              <button type="button" class="cockpit-tab on" id="modeProxy">
                <span>Proxy</span>
              </button>
              <button type="button" class="cockpit-tab" id="modeTun">
                <span>TUN</span>
              </button>
            </div>
          </div>

          <!-- Protocol Selector Card -->
          <div class="cockpit-card">
            <div class="card-caption">
              <span class="caption-title">Protokol</span>
              <span class="caption-desc" id="protoHint">Otomatik</span>
            </div>
            <div class="cockpit-segmented proto-segmented">
              <button type="button" class="cockpit-tab on" id="protoAuto" data-proto="auto" title="Otomatik Tünel">Oto</button>
              <button type="button" class="cockpit-tab" id="protoUpg" data-proto="upg" title="HTTPUpgrade - MEB & CDN Hızlı">UPG</button>
              <button type="button" class="cockpit-tab" id="protoWs" data-proto="ws" title="WebSocket - Standart">WS</button>
              <button type="button" class="cockpit-tab" id="protoGrpc" data-proto="grpc" title="gRPC - HTTP/2 Akış">gRPC</button>
            </div>
          </div>
        </div>

        <!-- Quick Browser Launcher (Linux/Windows) -->
        <div id="browserRow" class="browser-row" hidden>
          <button type="button" class="chrome-launch-btn" id="launchBrowserBtn">
            <span class="launch-icon">🌐</span>
            <span id="launchBrowserText">Tarayıcıyı tünel ile aç</span>
            <span class="launch-tag">İzole</span>
          </button>
        </div>

        <!-- Okul / kurum agi SSL denetimi uyarisi -->
        <div class="net-notice" id="netNotice" hidden>
          <p class="net-notice-text" id="netNoticeText"></p>
          <div class="net-notice-pins" id="netPins"></div>
          <button type="button" class="net-notice-btn" id="copyPins">Parmak izini kopyala</button>
        </div>

        <!-- Error Notification Toast -->
        <div class="alert-toast" id="errBox" hidden>
          <div class="alert-icon">!</div>
          <div class="alert-content">
            <p class="err-text" id="err"></p>
            <button type="button" class="net-notice-btn" id="elevateBtn" hidden>Yönetici olarak yeniden başlat</button>
          </div>
        </div>

        <!-- Server List Section -->
        <section class="blade-section">
          <div class="blade-header">
            <div class="blade-headline">
              <h2 id="nodesTitle">Düğümler</h2>
              <span class="blade-counter" id="serverCount">0</span>
            </div>
            <div class="blade-actions">
              <span class="hub-url" id="fetchHint"></span>
              <button type="button" class="blade-refresh-btn" id="reload" title="Düğümleri Güncelle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" />
                </svg>
              </button>
            </div>
          </div>

          <div class="nodes-scroller">
            <ul class="blade-list" id="nodes"></ul>
          </div>

          <!-- Manual Import Drawer -->
          <div class="manual-drawer">
            <button type="button" class="drawer-trigger" id="manualToggle">
              <span class="drawer-title" id="manualTitle">+ Abonelik kodu veya profil ekle</span>
              <span class="drawer-arrow">▾</span>
            </button>
            <div id="manual" class="drawer-body" hidden>
              <textarea id="paste" rows="2" spellcheck="false" placeholder="Abonelik kodu / linki (https://…/sub/…) ya da vless:// trojan:// vmess:// linki"></textarea>
              <button type="button" class="drawer-add-btn" id="add">İçe Aktar</button>
            </div>
          </div>
        </section>
      </main>

      <!-- Clean Flat Footer -->
      <footer class="footbar">
        <div class="footbar-left">
          <span class="port-indicator"></span>
          <span id="proxyHint" class="port-label">Proxy: 127.0.0.1:17890</span>
        </div>
        <div class="footbar-right">
          <span class="edition-tag">Aether</span>
          <span class="version-tag" id="versionTag"></span>
        </div>
      </footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>
