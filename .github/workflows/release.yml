name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "vlist/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Cekirdek surumu sabit: config bicimi bu surume gore yazildi (src/links.js).
  # Yukseltirken once yerelde "npm test" ve sing-box check ile dogrulayin.
  SING_BOX_VERSION: "1.14.2"
  # XHTTP hatlari icin ikinci cekirdek (sing-box XHTTP desteklemez)
  XRAY_VERSION: "26.9.9"
  NODE_VERSION: "22"

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm test
      - name: Fetch linux core
        run: |
          set -euo pipefail
          VER="${SING_BOX_VERSION}"
          mkdir -p resources/bin/linux build
          curl -fsSL -o linux.tgz "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz"
          tar -xzf linux.tgz
          cp "sing-box-${VER}-linux-amd64/sing-box" resources/bin/linux/aether-core
          chmod +x resources/bin/linux/aether-core
          curl -fsSL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -o -j xray.zip xray -d xray-tmp
          install -m 755 xray-tmp/xray resources/bin/linux/aether-xray
          python3 packaging/make_icon.py build/icon.png
      - name: Check generated configs with core
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs"); const L = require("./src/links");
            const link = "vless://00000000-0000-4000-8000-000000000000@vpn.example.com:443?type=httpupgrade&host=vpn.example.com&path=%2Fp-upg&security=tls&sni=vpn.example.com&alpn=http%2F1.1#t";
            const [p] = L.parseSubscription(link);
            const xh = "vless://00000000-0000-4000-8000-000000000000@vpn.example.com:443?type=xhttp&host=vpn.example.com&path=%2Fp-xh&mode=packet-up&security=tls&sni=vpn.example.com#x";
            const [px] = L.parseSubscription(xh);
            for (const tun of [false, true]) for (const insecure of [false, true]) {
              const opts = { tun, insecure, uplink: tun ? null : { server: "10.0.0.1", server_port: 8080 }, localPort: 17890, xrayPort: 17891, xrayProcess: "aether-xray" };
              fs.writeFileSync(`cfg-${tun}-${insecure}.json`, JSON.stringify(L.buildCoreConfig(p.outbound, opts)));
              fs.writeFileSync(`cfg-xh-${tun}-${insecure}.json`, JSON.stringify(L.buildCoreConfig(px.outbound, opts)));
            }
            fs.writeFileSync("xray-pin.json", JSON.stringify(L.buildXrayConfig(px.outbound, { pins: ["1dfc1605fbad358d8bc844f76d15203fac9ca5c1a79fd4857ffaf2864fbebf96"], uplink: { server: "10.0.0.1", server_port: 8080 }, socksPort: 17891 })));
            fs.writeFileSync("xray-plain.json", JSON.stringify(L.buildXrayConfig(px.outbound, { pins: [], uplink: null, socksPort: 17891 })));
          '
          for f in cfg-*.json; do resources/bin/linux/aether-core check -c "$f"; done
          for f in xray-*.json; do resources/bin/linux/aether-xray run -test -c "$f"; done
      - name: Build deb + tar.gz
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --linux deb tar.gz --publish never \
            --config.extraMetadata.version=1.2.${{ github.run_number }}
          ls -lh dist
      - name: AppImage (no FUSE)
        run: |
          set -euo pipefail
          VER="1.2.${{ github.run_number }}"
          APPDIR=dist/Aether.AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib"
          cp -a dist/linux-unpacked/. "$APPDIR/usr/lib/aether/"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/lib/aether/aether" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          cat > "$APPDIR/aether.desktop" <<EOF
          [Desktop Entry]
          Name=Aether
          Exec=aether
          Icon=aether
          Type=Application
          Categories=Network;
          EOF
          cp build/icon.png "$APPDIR/aether.png"
          cp build/icon.png "$APPDIR/.DirIcon"
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" "dist/aether-${VER}-linux-amd64.AppImage"
          ls -lh dist/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/aether-*.AppImage
            dist/aether-*.deb
            dist/aether-*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Fetch windows core
        shell: bash
        run: |
          set -euo pipefail
          VER="${SING_BOX_VERSION}"
          mkdir -p resources/bin/win build
          curl -fsSL -o win.zip "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-windows-amd64.zip"
          unzip -j win.zip "*/sing-box.exe" -d resources/bin/win
          mv resources/bin/win/sing-box.exe resources/bin/win/aether-core.exe
          curl -fsSL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-windows-64.zip"
          unzip -o -j xray.zip xray.exe -d resources/bin/win
          mv resources/bin/win/xray.exe resources/bin/win/aether-xray.exe
          curl -fsSL -A "Mozilla/5.0" -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          python packaging/fetch_wintun.py wintun.zip resources/bin/win/wintun.dll
          python packaging/make_icon.py build/icon.png
      - name: Build Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win zip --publish never --config.extraMetadata.version=1.2.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/aether-*.zip

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: out
      - run: ls -lh out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: Aether v1.2.${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          files: out/aether-*
