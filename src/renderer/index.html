<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aether</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <!-- Titlebar -->
      <header class="titlebar">
        <div class="brand">
          <div class="logo-wrap">
            <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <circle cx="12" cy="12" r="9" stroke-width="1.8" stroke-dasharray="36" stroke-dashoffset="10" />
              <circle cx="12" cy="12" r="4" fill="currentColor" />
            </svg>
          </div>
          <span class="brand-name">Aether</span>
        </div>
        <div class="titlebar-actions">
          <div class="pill" id="pill">
            <span class="pill-dot"></span>
            <span class="pill-text">kesik</span>
          </div>
          <button type="button" id="lang" class="lang-btn" title="Dili Değiştir">TR</button>
        </div>
      </header>

      <!-- Main Scrollable Area -->
      <main class="main">
        <!-- Power Core Stage -->
        <section class="stage">
          <div class="ring-wrapper">
            <button type="button" class="ring" id="ring" data-state="down" aria-label="Bağlan">
              <div class="ring-glow"></div>
              <div class="ring-core">
                <svg class="power-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                  <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
                  <line x1="12" y1="2" x2="12" y2="12" />
                </svg>
              </div>
            </button>
          </div>

          <div class="stage-info">
            <div class="status-indicator">
              <span class="status-beacon" id="beacon"></span>
              <span class="state" id="stateLabel">BAĞLANTI YOK</span>
            </div>
            <h1 class="node-name" id="nodeName">Sunucu Seçilmedi</h1>
            <div id="ipChip" class="ip-chip" hidden>
              <span class="ip-icon">🌐</span>
              <span id="ipValue" class="ip-val"></span>
            </div>
          </div>
        </section>

        <!-- Primary Action Button -->
        <div class="action-wrap">
          <button type="button" class="go" id="go">Bağlan</button>
        </div>

        <!-- Mode & Protocol Deck -->
        <div class="control-deck">
          <!-- Proxy / TUN Mode Card -->
          <div class="deck-card">
            <div class="card-header">
              <span class="card-title">Çalışma Modu</span>
              <span class="card-hint" id="modeHint">Tarayıcı & Sistem Proxy</span>
            </div>
            <div class="segmented-control">
              <button type="button" class="seg-btn on" id="modeProxy">Proxy</button>
              <button type="button" class="seg-btn" id="modeTun">TUN</button>
            </div>
          </div>

          <!-- Protocol Switcher Card -->
          <div class="deck-card">
            <div class="card-header">
              <span class="card-title">Protokol</span>
              <span class="card-hint" id="protoHint">Otomatik</span>
            </div>
            <div class="segmented-control proto-segmented">
              <button type="button" class="seg-btn on" id="protoAuto" data-proto="auto" title="Otomatik">Oto</button>
              <button type="button" class="seg-btn" id="protoWs" data-proto="ws" title="WebSocket - MEB & Tahta Standartı">WS</button>
              <button type="button" class="seg-btn" id="protoUpg" data-proto="upg" title="HTTPUpgrade - Yeni Nesil Stealth CDN">UPG</button>
              <button type="button" class="seg-btn" id="protoGrpc" data-proto="grpc" title="gRPC - HTTP/2 Yüksek Hız">gRPC</button>
            </div>
          </div>
        </div>

        <!-- Quick Launch Chrome (Linux/Windows Helper) -->
        <div id="browserRow" class="browser-row" hidden>
          <button type="button" class="browser-btn" id="launchBrowserBtn">
            <span class="b-icon">🚀</span>
            <span>Chrome'u VPN ile Başlat</span>
          </button>
        </div>

        <!-- Connection Pipeline Steps -->
        <ol class="steps" id="steps" hidden></ol>

        <!-- Error Banner -->
        <div class="err-box" id="errBox" hidden>
          <div class="err-icon">⚠️</div>
          <p class="err" id="err"></p>
        </div>

        <!-- Servers Deck -->
        <section class="server-card">
          <div class="server-card-head">
            <div class="server-title-group">
              <h2 id="nodesTitle">Sunucular</h2>
              <span class="server-badge" id="serverCount">0</span>
            </div>
            <div class="head-actions">
              <span class="fetch-hint" id="fetchHint">vlist.geldesat.com</span>
              <button type="button" class="refresh-btn" id="reload" title="Sunucu listesini güncelle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" />
                </svg>
              </button>
            </div>
          </div>

          <div class="nodes-container">
            <ul class="nodes" id="nodes"></ul>
          </div>

          <div class="manual-section">
            <button type="button" class="manual-toggle-btn" id="manualToggle">
              <span>Manuel VLESS Ekle</span>
              <span class="arrow">▾</span>
            </button>
            <div id="manual" class="manual" hidden>
              <textarea id="paste" rows="2" spellcheck="false" placeholder="vless://..."></textarea>
              <button type="button" class="add-btn" id="add">Ekle</button>
            </div>
          </div>
        </section>
      </main>

      <!-- Footer Bar -->
      <footer class="foot">
        <div class="foot-left">
          <span class="foot-dot"></span>
          <span id="proxyHint" class="proxy-text">127.0.0.1:17890</span>
        </div>
        <div class="foot-right">
          <span class="credit">Aether v1.2</span>
        </div>
      </footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>
